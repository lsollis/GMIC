services:
  gmic_fl:
    build:
      context: .
      dockerfile: Dockerfile

    # ✅ GPU access (Docker Compose v2)
    # gpus: all

    environment:
      - PYTHONUNBUFFERED=1

    # ❌ Remove this to avoid name conflicts across servers
    # container_name: gmic_fl_container

    volumes:
      - "${CURRENT_DIR}:/workspace"

    ports:
      - "8102:8102"
      - "8103:8103"
      - "8443:8443"

    shm_size: "32gb"
    stdin_open: true
    tty: true

    # ✅ Run server in foreground so logs are real logs
    command: >
      bash -lc "python -u -m nvflare.private.fed.app.server.server_train
      -m /workspace
      -s fed_server.json
      --set secure_train=true config_folder=config org=UHCC"